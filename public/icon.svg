<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="hpbdGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="108" fill="url(#hpbdGrad)"/>
  <!-- Medical Plus with Stethoscope Pulse Wave -->
  <g filter="url(#shadow)">
    <!-- White Medical Cross -->
    <rect x="226" y="100" width="60" height="312" rx="14" fill="#ffffff"/>
    <rect x="100" y="226" width="312" height="60" rx="14" fill="#ffffff"/>
    <!-- Central Pulse Wave -->
    <path d="M 120 256 L 210 256 L 235 190 L 265 320 L 295 230 L 315 270 L 330 256 L 392 256" 
          fill="none" stroke="#b91c1c" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Text Label -->
  <text x="256" y="460" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">HPBD OPS</text>
</svg>
